<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Job Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Link to Static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Job Scraper</h1>
        <form id="scrapeForm">
            <div class="form-grid">
                <div class="full form-block form-block-shared">
                    <label>Platform</label>
                    <select id="platform">
                        <option value="linkedin">LinkedIn</option>
                        <option value="rubyonremote">RubyOnRemote</option>
                        <option value="wantedly">Wantedly</option>
                    </select>
                </div>

                <div class="full form-section-label form-block-shared">Common Filters</div>

                <div class="form-block form-block-shared">
                    <label>Keywords</label>
                    <input type="text" id="job_keywords" value="Ruby on Rails" placeholder="e.g. Python Developer">
                    <small style="color: #666; font-size: 0.85em; display: block; margin-top: 4px;">
                        Exact phrase search (auto-quoted)
                    </small>
                </div>

                <div class="form-block form-block-shared">
                    <label>Location</label>
                    <select id="job_location">
                        <option value="Europe">Europe (All)</option>
                        <option value="United States">United States</option>
                        <option value="Japan" selected>Japan</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Germany">Germany</option>
                        <option value="France">France</option>
                        <option value="Spain">Spain</option>
                        <option value="Italy">Italy</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="Poland">Poland</option>
                        <option value="Sweden">Sweden</option>
                        <option value="Switzerland">Switzerland</option>
                        <option value="India">India</option>
                        <option value="Australia">Australia</option>
                        <option value="Singapore">Singapore</option>
                        <option value="Vietnam">Vietnam</option>
                    </select>
                </div>

                <div class="form-block form-block-shared">
                    <label>Pages to Scrape</label>
                    <input type="number" id="max_pages" value="1" min="1" max="10" placeholder="1-10">
                </div>

                <div class="form-block form-block-shared checkbox-row">
                    <input type="checkbox" id="headless" style="width:auto; margin-right:8px;">
                    <label for="headless">Headless Mode</label>
                </div>

                <div class="full form-section-label form-block form-block-linkedin">LinkedIn Filters</div>

                <div class="form-block form-block-linkedin">
                    <label>Workplace Type</label>
                    <select id="workplace_type">
                        <option value="">All</option>
                        <option value="on-site">On-site</option>
                        <option value="remote" selected>Remote</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>

                <div class="form-block form-block-linkedin">
                    <label>Industry (LinkedIn)</label>
                    <select id="industry_filter">
                        <option value="">All Industries</option>
                        <option value="4">Computer Software</option>
                        <option value="6">Internet</option>
                        <option value="96">Information Technology</option>
                        <option value="3">Staffing & Recruiting</option>
                        <option value="51">Marketing & Advertising</option>
                    </select>
                </div>

                <div class="form-block form-block-linkedin">
                    <label>Posted Within</label>
                    <select id="time_posted">
                        <option value="">Any Time</option>
                        <option value="r86400">Last 24 hours</option>
                        <option value="r604800">Last Week</option>
                        <option value="r2592000">Last Month</option>
                    </select>
                </div>

                <div class="form-block form-block-linkedin">
                    <label>Sort By</label>
                    <select id="sort_by">
                        <option value="">Most Relevant</option>
                        <option value="R">Most Recent</option>
                        <option value="DD">Date Posted</option>
                    </select>
                </div>

                <div class="full form-section-label form-block form-block-wantedly">Wantedly Filters</div>

                <div class="form-block form-block-wantedly">
                    <label>Hiring Type (Wantedly)</label>
                    <select id="hiring_type">
                        <option value="mid_career" selected>Mid Career</option>
                        <option value="newgrad">New Graduate</option>
                    </select>
                </div>

                <div class="form-block form-block-wantedly">
                    <label>Order (Wantedly)</label>
                    <select id="wantedly_order">
                        <option value="mixed" selected>Mixed</option>
                        <option value="recent">Recent</option>
                    </select>
                </div>

                <div class="form-block form-block-wantedly checkbox-row">
                    <input type="checkbox" id="only_new" checked style="width:auto; margin-right:8px;">
                    <label for="only_new">Wantedly: Only New</label>
                </div>
            </div>
            <button type="submit" id="startBtn" class="btn">Start Scraping</button>
        </form>
    </div>

    <div id="statusPanel" class="card">
        <div style="display:flex; justify-content:space-between;">
            <h3>Current Status</h3>
            <span id="statusBadge" class="status-badge running">RUNNING</span>
        </div>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill pulse"></div>
        </div>
        <p id="statusRunAt" style="color: #64748b; font-size: 0.9rem; margin-bottom: 0.5rem;"></p>
        <p id="statusText">Initializing...</p>
        <div id="cancelArea" style="display:none;">
            <button id="cancelBtn" class="btn btn-danger">Cancel Task</button>
        </div>
        <div id="downloadArea" style="display:none;">
            <button id="downloadBtn" class="btn btn-success">Download CSV</button>
            <button id="findContactsBtn" class="btn btn-secondary">Find Contacts</button>
        </div>
    </div>

    <div id="contactStatusPanel" class="card" style="display:none;">
        <div style="display:flex; justify-content:space-between;">
            <h3>Contact Finder Status</h3>
            <span id="contactStatusBadge" class="status-badge running">RUNNING</span>
        </div>
        <div class="progress-bar">
            <div id="contactProgressFill" class="progress-fill pulse" style="width: 20%;"></div>
        </div>
        <p id="contactStatusText">Initializing contact finder...</p>
        <div id="contactCancelArea" style="display:none;">
            <button id="contactCancelBtn" class="btn btn-danger">Cancel Contact Task</button>
        </div>
        <div id="contactDownloadArea" style="display:none;">
            <button id="contactDownloadBtn" class="btn btn-success">Download Contacts CSV</button>
        </div>
    </div>

    <div class="card">
        <div class="section-header">
            <h3>History</h3>
            <button id="refreshHistoryBtn" class="btn btn-secondary">Refresh</button>
        </div>
        <div id="jobHistory"></div>
    </div>
</div>

<!-- Link to Static JS -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
